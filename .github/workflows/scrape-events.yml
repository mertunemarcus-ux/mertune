name: Mertune Event Scraper

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours, 24/7
  workflow_dispatch:        # Manual trigger anytime

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run event scraper
        run: python3 scripts/scrape_events.py

      - name: Inject events into app.html
        run: python3 scripts/deploy_github.py

      - name: Deploy to Vercel
        run: |
          mkdir -p /tmp/vercel-mertune/.vercel
          echo '{"projectId":"${{ secrets.VERCEL_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}' > /tmp/vercel-mertune/.vercel/project.json
          cd /tmp/vercel-mertune && npx vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }} < /dev/null

      - name: Commit updated app.html
        run: |
          git config user.name "Mertune Bot"
          git config user.email "bot@mertune.com"
          git add public/app.html
          git diff --staged --quiet || git commit -m "Auto-update events $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
