<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<meta name='impact-site-verification' value='7ff6abf9-9e70-4d4e-8578-728d4d1609dd'/>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; }
#map { width: 100%; height: 100%; }

/* Top nav */
#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 52px;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0,0,0,0.1);
  display: flex; align-items: center; padding: 0 16px; gap: 8px;
}
#breadcrumb {
  font-size: 14px; font-weight: 600; color: #333;
  display: flex; align-items: center; gap: 6px; flex: 1;
}
.crumb { color: #007AFF; cursor: pointer; }
.crumb:hover { text-decoration: underline; }
.crumb-sep { color: #999; font-size: 12px; }
.crumb-current { color: #333; cursor: default; }

/* Search bar */
#search-bar {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  z-index: 500; display: none;
  flex-direction: column;
  width: 380px; max-width: 92vw;
}
#search-input-wrap {
  display: flex; align-items: center; gap: 10px;
  background: white; border-radius: 14px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
  padding: 12px 16px;
  border: 2px solid transparent;
  transition: border-color 0.2s;
}
#search-input-wrap:focus-within {
  border-color: #007AFF;
}
#search-input-wrap .search-icon { font-size: 18px; color: #999; flex-shrink:0; }
#search-input {
  border: none; outline: none; font-size: 16px; flex: 1;
  color: #111; background: transparent;
  font-family: -apple-system, sans-serif;
}
#search-input::placeholder { color: #aaa; }
#search-clear {
  font-size: 18px; color: #ccc; cursor: pointer;
  display: none; flex-shrink: 0;
  background: none; border: none; padding: 0;
}
#search-clear:hover { color: #999; }
/* Results dropdown */
#search-results {
  background: white; border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  margin-top: 8px; overflow: hidden;
  max-height: 60vh; overflow-y: auto;
  display: none;
}
.search-result {
  padding: 12px 16px; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid #f5f5f5;
  transition: background 0.15s;
}
.search-result:last-child { border-bottom: none; }
.search-result:hover, .search-result.selected { background: #f5f9ff; }
.sr-dot {
  width: 12px; height: 12px; border-radius: 50%;
  flex-shrink: 0; border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
}
.sr-info { flex: 1; min-width: 0; }
.sr-name {
  font-size: 14px; font-weight: 700; color: #111;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sr-name mark {
  background: #fff3b0; color: #111;
  border-radius: 2px; padding: 0 1px;
  font-weight: 800;
}
.sr-meta { font-size: 12px; color: #888; margin-top: 1px; }
.sr-event { font-size: 11px; color: #007AFF; margin-top: 2px; font-weight: 600; }
.sr-badge {
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 8px;
  color: #fff; flex-shrink: 0;
}
.search-section-header {
  padding: 8px 16px 4px;
  font-size: 10px; font-weight: 800;
  color: #999; text-transform: uppercase;
  letter-spacing: 0.8px; background: #fafafa;
}
#search-no-results {
  padding: 20px 16px; text-align: center;
  color: #999; font-size: 14px; display: none;
}

/* Hint pill */
#hint {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  z-index: 100;
  background: rgba(0,0,0,0.75); color: white;
  padding: 10px 20px; border-radius: 24px;
  font-size: 14px; font-weight: 600;
  pointer-events: none; white-space: nowrap;
  transition: opacity 0.3s;
}

/* Venue popup */
#venue-popup {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: white; border-radius: 20px 20px 0 0;
  box-shadow: 0 -4px 30px rgba(0,0,0,0.15);
  padding: 20px; display: none;
  max-height: 60vh; overflow-y: auto;
  transform: translateY(100%); transition: transform 0.3s ease;
}
#venue-popup.open { transform: translateY(0); }
#venue-popup h2 { font-size: 20px; font-weight: 800; color: #111; margin-bottom: 4px; }
#venue-popup .category { font-size: 13px; color: #007AFF; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
#venue-popup .address { font-size: 14px; color: #666; margin-bottom: 12px; }
#venue-popup .close-btn {
  position: absolute; top: 16px; right: 16px;
  width: 30px; height: 30px; border-radius: 50%; background: #f0f0f0;
  border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
}

/* ── Filter Sidebar ─────────────────────────────────────────────────────── */
#filter-btn {
  position:fixed;top:60px;left:12px;z-index:200;
  background:white;border:1px solid #ddd;border-radius:10px;
  padding:8px 12px;cursor:pointer;font-size:13px;font-weight:600;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);display:none;
  align-items:center;gap:6px;color:#333;white-space:nowrap;
}
#filter-sidebar {
  position:fixed;top:52px;left:-280px;bottom:0;width:280px;
  background:white;z-index:300;display:flex;flex-direction:column;
  box-shadow:3px 0 20px rgba(0,0,0,0.15);overflow:hidden;
  transition:left 0.3s ease;
}
#filter-sidebar.open{left:0;}
#filter-sidebar.open{display:flex;}
#filter-header{padding:14px 16px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;}
#filter-header h3{font-size:15px;font-weight:700;color:#111;}
#filter-close{background:none;border:none;cursor:pointer;font-size:20px;color:#888;}
#filter-pills{padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid #eee;min-height:36px;align-items:center;overflow:hidden;}
.filter-pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;color:white;display:inline-flex;align-items:center;gap:4px;}
#filter-body{flex:1;overflow-y:auto;padding:8px 0;}
.filter-category{border-bottom:1px solid #f0f0f0;}
.filter-cat-header{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:#fafafa;}
.filter-cat-title{font-size:13px;font-weight:700;color:#222;display:flex;align-items:center;gap:8px;}
.filter-cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.filter-cat-actions span{font-size:11px;color:#007AFF;cursor:pointer;font-weight:600;margin-left:8px;}
.filter-cat-chevron{font-size:11px;color:#999;transition:transform 0.2s;}
.filter-cat-chevron.open{transform:rotate(180deg);}
.filter-subs{display:none;padding:4px 0 8px 0;}
.filter-subs.open{display:block;}
.filter-sub-item{padding:5px 16px 5px 28px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.filter-sub-item:hover{background:#f5f5f5;}
.filter-sub-item input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:#007AFF;flex-shrink:0;}
.filter-sub-label{font-size:12px;color:#333;flex:1;}
.filter-sub-color{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.filter-sub-count{font-size:11px;color:#999;font-weight:600;}
/* ── Legend ─────────────────────────────────────────────────────────────── */
#legend{position:fixed;bottom:70px;left:12px;z-index:200;background:white;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.15);overflow:hidden;display:none;min-width:200px;}
#legend-header{padding:8px 12px;background:#f5f5f5;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
#legend-header span{font-size:12px;font-weight:700;color:#333;}
#legend-toggle{font-size:12px;color:#999;}
#legend-body{padding:8px 12px;}
.legend-row{display:flex;align-items:center;gap:8px;padding:3px 0;}
.legend-dot{width:10px;height:10px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px rgba(0,0,0,0.15);flex-shrink:0;}
.legend-label{font-size:12px;color:#444;}

/* ── Business Card ──────────────────────────────────────────────────────── */
#business-card {
  position: fixed;
  top: 52px; right: -380px; bottom: 0;
  width: 360px;
  background: #fff;
  box-shadow: -4px 0 30px rgba(0,0,0,0.15);
  z-index: 600;
  display: flex;
  flex-direction: column;
  transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow: hidden;
}
#business-card.open { right: 0; }

/* Card Header - colored band */
#bc-header {
  padding: 20px 20px 16px;
  position: relative;
  flex-shrink: 0;
}
#bc-close {
  position: absolute; top: 14px; right: 14px;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: none; cursor: pointer;
  font-size: 18px; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
#bc-close:hover { background: rgba(255,255,255,0.4); }
#bc-category-badge {
  display: inline-block;
  font-size: 10px; font-weight: 800;
  letter-spacing: 1px; text-transform: uppercase;
  color: rgba(255,255,255,0.9);
  background: rgba(255,255,255,0.2);
  padding: 3px 10px; border-radius: 20px;
  margin-bottom: 8px;
}
#bc-name {
  font-size: 22px; font-weight: 900;
  color: #fff; line-height: 1.2;
  margin: 0;
}
#bc-subtitle {
  font-size: 13px; color: rgba(255,255,255,0.8);
  margin-top: 4px;
}

/* Card Body */
#bc-body {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}

/* Info rows */
.bc-section {
  padding: 14px 20px;
  border-bottom: 1px solid #f0f0f0;
}
.bc-section:last-child { border-bottom: none; }
.bc-section-title {
  font-size: 10px; font-weight: 800;
  color: #999; text-transform: uppercase;
  letter-spacing: 0.8px; margin-bottom: 8px;
}
.bc-info-row {
  display: flex; align-items: flex-start;
  gap: 10px; margin-bottom: 6px;
}
.bc-info-row:last-child { margin-bottom: 0; }
.bc-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.bc-info-text { font-size: 14px; color: #333; line-height: 1.4; }
.bc-info-link {
  font-size: 14px; color: #007AFF;
  text-decoration: none; font-weight: 500;
}
.bc-info-link:hover { text-decoration: underline; }

/* Event rows */
.bc-event {
  padding: 10px 0;
  border-bottom: 1px solid #f5f5f5;
}
.bc-event:last-child { border-bottom: none; }
.bc-poster { display:block; position:relative; margin:-4px -4px 10px; border-radius:12px; overflow:hidden; background:#111; box-shadow:0 6px 18px rgba(0,0,0,0.35); }
.bc-poster img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; }
.bc-poster-tag { position:absolute; left:10px; bottom:10px; background:#FF3B30; color:#fff; font-size:11px; font-weight:800; letter-spacing:.5px; padding:4px 9px; border-radius:999px; box-shadow:0 2px 8px rgba(0,0,0,.4); }
.bc-event-today { border:1.5px solid #FF3B30; border-radius:12px; padding:8px !important; background:rgba(255,59,48,0.05); }
.bc-event-badge {
  display: inline-block;
  font-size: 9px; font-weight: 800;
  padding: 2px 7px; border-radius: 10px;
  color: #fff; margin-bottom: 4px;
  letter-spacing: 0.5px;
}
.bc-event-title {
  font-size: 14px; font-weight: 700; color: #111;
  margin-bottom: 2px;
}
.bc-event-date { font-size: 12px; color: #666; }
.bc-event-ticket {
  display: inline-block;
  font-size: 12px; color: #007AFF;
  font-weight: 600; margin-top: 4px;
  text-decoration: none;
}

/* Capacity bar */
.bc-capacity-bar {
  height: 4px; background: #f0f0f0;
  border-radius: 2px; margin-top: 6px;
  overflow: hidden;
}
.bc-capacity-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, #007AFF, #00C2FF);
}

/* Action buttons */
#bc-actions, #bc-actions-2 {
  padding: 6px 20px;
  display: flex; gap: 10px;
  flex-shrink: 0;
}
#bc-actions {
  padding-top: 14px;
  border-top: 1px solid #f0f0f0;
}
#bc-actions-2 {
  padding-bottom: 14px;
}
.bc-btn {
  flex: 1; padding: 12px 8px;
  border-radius: 12px; border: none;
  font-size: 13px; font-weight: 700;
  cursor: pointer; text-align: center;
  text-decoration: none; display: flex;
  align-items: center; justify-content: center; gap: 5px;
}
.bc-btn-primary {
  background: #111; color: #fff;
}
.bc-btn-secondary {
  background: #f5f5f5; color: #333;
}
.bc-btn:hover { opacity: 0.85; }
@keyframes lastDayPulse{0%,100%{transform:scale(1);box-shadow:0 0 15px #FF3B30,0 0 30px #FF3B30;}50%{transform:scale(1.3);box-shadow:0 0 25px #FF3B30,0 0 50px #FF3B30;}}

/* ---- Phone layout (<= 640px) ---- */
@media (max-width: 640px) {
  #search-bar { width: calc(100vw - 24px); max-width: none; top: 56px; }
  #search-results { max-height: calc(100vh - 150px); }
  #business-card {
    top: auto; bottom: -100vh; right: 0; left: 0; width: 100vw;
    height: 78vh; border-radius: 22px 22px 0 0;
    box-shadow: 0 -6px 30px rgba(0,0,0,0.22);
    transition: bottom 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  #business-card.open { bottom: 0; right: 0; }
  #business-card::before { content:''; position:absolute; top:8px; left:50%; width:40px; height:5px; margin-left:-20px; border-radius:3px; background:rgba(255,255,255,0.6); z-index:2; }
  #bc-header { padding: 24px 20px 14px; }
  #bc-close { width: 36px; height: 36px; top: 12px; right: 12px; font-size: 20px; }
  #bc-name { font-size: 22px; }
  .bc-btn { padding: 14px 10px; font-size: 15px; }
  .bc-event-ticket { padding: 10px 0; font-size: 15px; }
  #hint { bottom: 24px; font-size: 14px; }
}
</style>
</head>

// ─── Level 1: USA States ──────────────────────────────────────────────────────
function loadUSAStates() {
  fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json')
    .then(function(r){ return r.json(); })
    .then(function(data) {
      map.addSource('states', { type: 'geojson', data: data });

      // Fill
      map.addLayer({
        id: 'states-fill',
        type: 'fill',
        source: 'states',
        paint: {
          'fill-color': [
            'case',
            ['in', ['get', 'name'], ['literal', UNLOCKED_STATES]], '#007AFF',
            '#b8cce4'
          ],
          'fill-opacity': [
            'case',
            ['boolean', ['feature-state', 'hover'], false], 0.5,
            ['in', ['get', 'name'], ['literal', UNLOCKED_STATES]], 0.35,
            0.2
          ]
        }
      });

      // Borders
      map.addLayer({
        id: 'states-border',
        type: 'line',
        source: 'states',
        paint: {
          'line-color': '#4a7fb5',
          'line-width': 1
        }
      });

      // Unlocked state highlight border
      map.addLayer({
        id: 'florida-border',
        type: 'line',
        source: 'states',
        filter: ['in', ['get', 'name'], ['literal', UNLOCKED_STATES]],
        paint: {
          'line-color': '#007AFF',
          'line-width': 2.5
        }
      });

      setupStateHover();
      setupStateClick();
    });
}

var hoveredStateId = null;
function setupStateHover() {
  map.on('mousemove', 'states-fill', function(e) {
    if (level !== 'country') return;
    if (e.features.length > 0) {
      var name = e.features[0].properties.name;
      // Always reset previous
      if (hoveredStateId !== null) {
        map.setFeatureState({ source: 'states', id: hoveredStateId }, { hover: false });
        hoveredStateId = null;
      }
      if (name === 'Florida') {
        map.getCanvas().style.cursor = 'pointer';
      } else {
        map.getCanvas().style.cursor = 'not-allowed';
      }
    }
  });
  map.on('mouseleave', 'states-fill', function() {
    if (hoveredStateId !== null) {
      map.setFeatureState({ source: 'states', id: hoveredStateId }, { hover: false });
      hoveredStateId = null;
    }
    map.getCanvas().style.cursor = '';
  });
}

function setupStateClick() {
  map.on('click', 'states-fill', function(e) {
    if (level !== 'country') return;
    var name = e.features[0].properties.name;
    if (UNLOCKED_STATES.indexOf(name) !== -1) {
      enterState(name);
    } else {
      showHint(name + ' — Coming Soon');
      setTimeout(function(){ showHint('Click a state to explore'); }, 2000);
    }
  });
}

// ─── Level 2: State Cities ────────────────────────────────────────────────────
function enterState(name) {
  var view = STATE_VIEWS[name];
  if (!view) return;
  level = 'state';
  selectedState = name;
  updateBreadcrumb();
  showHint('Click a city to explore');

  // Fly to the state (fit bounds when defined so phones/tablets frame it fully)
  if (view.bounds) {
    map.fitBounds(view.bounds, { padding: { top: 70, bottom: 80, left: 16, right: 16 }, pitch: 0, bearing: 0, duration: 1800, essential: true });
  } else {
    map.flyTo({ center: view.center, zoom: view.zoom, pitch: 0, duration: 1800, essential: true });
  }

  setTimeout(function() {
    view.addCities();
  }, 1900);
}

function enterFlorida() { enterState('Florida'); }

// ─── Level 2: New York Cities ─────────────────────────────────────────────────
function addNewYorkCities() {
  var cityGeoJSON = {
    type: 'FeatureCollection',
    features: NY_CITIES.map(function(c) {
      return {
        type: 'Feature',
        properties: { id: c.id, name: c.name, live: c.live },
        geometry: { type: 'Point', coordinates: [c.lng, c.lat] }
      };
    })
  };
  map.addSource('fl-cities', { type:'geojson', data: cityGeoJSON });

  map.addLayer({
    id: 'city-dots',
    type: 'circle',
    source: 'fl-cities',
    paint: {
      'circle-radius': 8,
      'circle-color': ['case', ['get', 'live'], '#007AFF', '#111'],
      'circle-stroke-width': 3,
      'circle-stroke-color': '#fff'
    }
  });

  map.addLayer({
    id: 'city-labels',
    type: 'symbol',
    source: 'fl-cities',
    layout: {
      'text-field': ['get', 'name'],
      'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
      'text-size': 13,
      'text-offset': [0, 1.6],
      'text-anchor': 'top'
    },
    paint: {
      'text-color': '#111',
      'text-halo-color': '#fff',
      'text-halo-width': 2
    }
  });

  map.on('mousemove', 'city-dots', function() {
    if (level !== 'state') return;
    map.getCanvas().style.cursor = 'pointer';
  });
  map.on('mouseleave', 'city-dots', function() {
    map.getCanvas().style.cursor = '';
  });

  map.on('click', 'city-dots', function(e) {
    if (level !== 'state' || selectedState !== 'New York') return;
    var p = e.features[0].properties;
    if (p.live) {
      enterNYC();
    } else {
      showHint(p.name + ' — Coming Soon');
      setTimeout(function(){ showHint('Click a city to explore'); }, 2000);
    }
  });
}

// ─── Level 3: New York City View ──────────────────────────────────────────────
function enterNYC() {
  level = 'city';
  selectedCity = 'New York City';
  updateBreadcrumb();
  showHint('');

  ['states-fill','states-border','florida-border','city-regions','city-region-borders','city-dots','city-labels'].forEach(function(l) {
    if (map.getLayer(l)) map.removeLayer(l);
  });
  ['fl-voronoi','fl-cities'].forEach(function(s) {
    if (map.getSource(s)) map.removeSource(s);
  });

  // Fly to Manhattan with 3D tilt
  map.flyTo({
    center: [-73.9857, 40.7484],
    zoom: 14,
    pitch: 60,
    bearing: -25,
    duration: 2500,
    essential: true
  });

  setTimeout(function() {
    add3DBuildings();
  }, 3000);
}

// ─── Florida State-Level Venue Markers ───────────────────────────────────────
var floridaMarkers = [];

function addFloridaVenueMarkers() {
  // Remove existing florida markers
  floridaMarkers.forEach(function(m){ m.remove(); });
  floridaMarkers = [];

  // Individual cruise terminals only show in Miami city zoom
  var stateHideIds = ['terminal_aa','terminal_a','terminal_b','terminal_def','terminal_j','terminal_v'];

  VENUES.forEach(function(v) {
    // Skip individual cruise terminals at state level (show portmiami_main instead)
    if (stateHideIds.indexOf(v.id) !== -1) return;
    // Skip seasonal venues that have ended
    var today = new Date(); today.setHours(0,0,0,0);
    if (v.seasonal_end) {
      var endDate = new Date(v.seasonal_end); endDate.setHours(0,0,0,0);
      if (today > endDate) return;
    }

    var color = getMarkerColor(v.subcategory);
    var el = document.createElement('div');
    // Small dots for state view - not clickable for city zoom
    el.style.cssText = 'width:12px;height:12px;border-radius:50%;background:'+color+
      ';border:2px solid rgba(255,255,255,0.9);box-shadow:0 0 10px '+color+', 0 0 20px '+color+'88'+
      ';cursor:pointer;pointer-events:auto;z-index:10;';
    el.title = v.name;

    // Click shows business card but does NOT zoom into city
    el.title = v.name + ' — ' + (v.subcategory || '');
    el.addEventListener('mouseenter', function(){
      this.style.boxShadow = '0 0 16px '+color+', 0 0 32px '+color+', 0 0 48px '+color+'88';
      this.style.border = '2px solid #fff';
    });
    el.addEventListener('mouseleave', function(){
      this.style.boxShadow = '0 0 10px '+color+', 0 0 20px '+color+'88';
      this.style.border = '2px solid rgba(255,255,255,0.9)';
    });
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      openBusinessCard(v);
    });

    var marker = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([v.lng, v.lat])
      .addTo(map);
    floridaMarkers.push(marker);
  });
}

function removeFloridaVenueMarkers() {
  floridaMarkers.forEach(function(m){ m.remove(); });
  floridaMarkers = [];
}

// ─── Level 3: Miami City View ─────────────────────────────────────────────────
function enterMiami() {
  level = 'city';
  removeFloridaVenueMarkers(); // Clean up state-level dots
  selectedCity = 'Miami';
  updateBreadcrumb();
  showHint('');

  // Remove state/voronoi layers so colors don't show over city
  ['states-fill','states-border','florida-border','city-regions','city-region-borders','city-dots','city-labels'].forEach(function(l) {
    if (map.getLayer(l)) map.removeLayer(l);
  });
  ['fl-voronoi','fl-cities'].forEach(function(s) {
    if (map.getSource(s)) map.removeSource(s);
  });

  // Fly to Miami with 3D tilt
  map.flyTo({
    center: [-80.2050, 25.7750],
    zoom: 13.5,
    pitch: 60,
    bearing: -20,
    duration: 2800,
    essential: true
  });

  // Force 3D after fly completes
  map.once('moveend', function() {
    map.easeTo({ pitch: 60, bearing: -20, duration: 200 });
    setTimeout(function() {
      add3DBuildings();
      addVenueMarkers();
      showSearchBar();
    }, 300);
  });

  // Fallback timeout in case moveend fires too early
  setTimeout(function() {
    if (level !== 'city') return;
    map.easeTo({ pitch: 60, bearing: -20, duration: 200 });
    add3DBuildings();
    addVenueMarkers();
    showSearchBar();
  }, 3200);
}

function add3DBuildings() {
  if (map.getLayer('3d-buildings')) return;
  // Try multiple source-layer names used by Carto
  var attempts = [
    { source: 'carto', sourceLayer: 'building' },
    { source: 'carto', sourceLayer: 'buildings' },
  ];
  // Find actual building source from style
  try {
    var layers = map.getStyle().layers || [];
    for (var i = 0; i < layers.length; i++) {
      var l = layers[i];
      if (l.type === 'fill' && l['source-layer'] && l['source-layer'].indexOf('build') !== -1) {
        attempts.unshift({ source: l.source, sourceLayer: l['source-layer'] });
        break;
      }
    }
  } catch(e) {}

  for (var a = 0; a < attempts.length; a++) {
    try {
      map.addLayer({
        id: '3d-buildings', type: 'fill-extrusion',
        source: attempts[a].source,
        'source-layer': attempts[a].sourceLayer,
        minzoom: 12,
        paint: {
          'fill-extrusion-color': '#c8d4e0',
          'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 8],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0],
          'fill-extrusion-opacity': 0.7
        }
      });
      console.log('3D buildings added with', attempts[a].source, attempts[a].sourceLayer);
      break;
    } catch(e) { console.log('3D attempt failed:', attempts[a], e.message); }
  }
}

// ─── Filter & Legend UI ───────────────────────────────────────────────────────
function showFilterUI() {
  buildFilterUI();
  buildLegend();
  document.getElementById('filter-btn').style.display = 'block';
  // legend removed
}

function hideFilterUI() {
  document.getElementById('filter-btn').style.display = 'none';
  document.getElementById('filter-sidebar').style.display = 'none';
  document.getElementById('legend').style.display = 'none';
}

function toggleFilter() {
  var sb = document.getElementById('filter-sidebar');
  sb.style.display = (sb.style.display === 'block') ? 'none' : 'block';
}

function toggleLegend() {
  var body = document.getElementById('legend-body');
  var arrow = document.getElementById('legend-toggle');
  var open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  arrow.textContent = open ? '▼' : '▲';
}

function buildFilterUI() {
  var body = document.getElementById('filter-body');
  var html = '';
  Object.keys(CATEGORIES).forEach(function(cat) {
    var subs = Object.keys(CATEGORIES[cat].subs).filter(function(sub) {
      return VENUES.some(function(v){ return v.subcategory === sub; });
    });
    if (!subs.length) return;
    html += '<div style="font-size:12px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin:14px 0 6px;">' + cat + '</div>';
    subs.forEach(function(sub) {
      var color = CATEGORIES[cat].subs[sub].color;
      html += '<label style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:14px;">' +
        '<input type="checkbox" ' + (activeFilters[sub] ? 'checked' : '') + ' onchange="setFilter(\'' + sub.replace(/'/g, "\\'") + '\', this.checked)">' +
        '<span style="width:12px;height:12px;border-radius:50%;background:' + color + ';display:inline-block;"></span>' +
        sub + '</label>';
    });
  });
  body.innerHTML = html;
}

function setFilter(sub, on) {
  activeFilters[sub] = on;
  applyFilters();
}

function applyFilters() {
  venueMarkers.forEach(function(m) {
    var v = m._mertuneVenue;
    m.getElement().style.display = activeFilters[v.subcategory] ? 'block' : 'none';
  });
}

function buildLegend() {
  var body = document.getElementById('legend-body');
  var html = '';
  Object.keys(CATEGORIES).forEach(function(cat) {
    var used = Object.keys(CATEGORIES[cat].subs).filter(function(sub) {
      return VENUES.some(function(v){ return v.subcategory === sub; });
    });
    if (!used.length) return;
    html += '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;">' +
      '<span style="width:10px;height:10px;border-radius:50%;background:' + CATEGORIES[cat].color + ';display:inline-block;"></span>' +
      cat + '</div>';
  });
  body.innerHTML = html;
}

function addVenueMarkers() {
  if (venueMarkersAdded) return; // prevent double-add
  venueMarkersAdded = true;
  function makeMarker(v) {
    var color = getMarkerColor(v.subcategory);
    var size = getMarkerSize(v.capacity);
    var el = document.createElement('div');
    var _isLastDay = false;
    if (v.seasonal_end) {
      var _vEnd = new Date(v.seasonal_end); _vEnd.setHours(0,0,0,0);
      var _vNow = new Date(); _vNow.setHours(0,0,0,0);
      _isLastDay = _vEnd.getTime() === _vNow.getTime();
    }
    el.style.cssText = 'width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+color+';border:2.5px solid #fff;box-shadow:0 0 8px '+color+', 0 2px 6px rgba(0,0,0,0.3);cursor:pointer;'+(_isLastDay?'animation:lastDayPulse 1s ease-in-out infinite;':'');
    el.setAttribute('title', v.name + ' — ' + v.subcategory);
    el.addEventListener('mouseenter', function(){ this.style.boxShadow='0 0 0 4px '+color+'66, 0 2px 8px rgba(0,0,0,0.4)'; this.style.border='2.5px solid #fff'; });
    el.addEventListener('mouseleave', function(){ this.style.boxShadow='0 2px 6px rgba(0,0,0,0.35)'; });
    el.addEventListener('click', function(e){ e.stopPropagation(); openBusinessCard(v); });
    var marker = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([v.lng, v.lat])
      .addTo(map);
    marker._mertuneVenue = v;
    venueMarkers.push(marker);
  }
  var _today = new Date(); _today.setHours(0,0,0,0);
  for (var i = 0; i < VENUES.length; i++) {
    var _v = VENUES[i];
    // Hide the single port dot in city view - show individual terminals instead
    if (_v.id === 'portmiami_main') continue;
    if (_v.seasonal_end) {
      var _end = new Date(_v.seasonal_end); _end.setHours(0,0,0,0);
      if (_today > _end) continue;
    }
    makeMarker(_v);
  }
  showFilterUI();
}

// ── Google-style Search ───────────────────────────────────────────────────────
var selectedResultIdx = -1;

function fuzzyMatch(str, query) {
  // Returns score 0-100, 0 = no match
  str = str.toLowerCase(); query = query.toLowerCase().trim();
  if (!query) return 0;
  if (str === query) return 100;
  if (str.startsWith(query)) return 90;
  if (str.includes(query)) return 80;
  // Word match
  var words = str.split(/[\s,.-]+/);
  for (var i = 0; i < words.length; i++) {
    if (words[i].startsWith(query)) return 70;
  }
  // Fuzzy: check if all chars appear in order
  var qi = 0;
  for (var si = 0; si < str.length && qi < query.length; si++) {
    if (str[si] === query[qi]) qi++;
  }
  if (qi === query.length) return 40;
  return 0;
}

function highlightMatch(text, query) {
  if (!query) return text;
  var idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.substring(0, idx) +
    '<mark>' + text.substring(idx, idx + query.length) + '</mark>' +
    text.substring(idx + query.length);
}

function doSearch(query) {
  var resultsDiv = document.getElementById('search-results');
  var clearBtn = document.getElementById('search-clear');
  
  clearBtn.style.display = query ? 'block' : 'none';
  
  // Always clear first
  resultsDiv.innerHTML = '';
  selectedResultIdx = -1;

  if (!query || query.length < 1) {
    resultsDiv.style.display = 'none';
    return;
  }

  // Search venues by name, category, address
  var venueResults = [];
  VENUES.forEach(function(v) {
    var scores = [
      fuzzyMatch(v.name, query) * 2,
      fuzzyMatch(v.subcategory || '', query),
      fuzzyMatch(v.address || '', query) * 0.5,
    ];
    var score = Math.max.apply(null, scores);
    if (score > 0) venueResults.push({ venue: v, score: score });
  });

  // Search events
  var eventResults = [];
  var seenVenueIds = {};
  venueResults.forEach(function(r){ seenVenueIds[r.venue.id] = true; });

  VENUES.forEach(function(v) {
    if (seenVenueIds[v.id]) return;
    var events = EVENTS[v.id] || [];
    events.forEach(function(ev) {
      var score = fuzzyMatch(ev.title, query);
      if (score > 30) {
        eventResults.push({ venue: v, event: ev, score: score * 0.8 });
        seenVenueIds[v.id] = true;
      }
    });
  });

  venueResults.sort(function(a,b){ return b.score - a.score; });
  eventResults.sort(function(a,b){ return b.score - a.score; });

  var allResults = venueResults.slice(0,5).concat(eventResults.slice(0,3));

  if (allResults.length === 0) {
    resultsDiv.innerHTML = '<div style="padding:16px;text-align:center;color:#999;font-size:14px;">No results for "' + query + '"</div>';
    resultsDiv.style.display = 'block';
    return;
  }

  // Venue results
  if (venueResults.length > 0) {
    var vh = document.createElement('div');
    vh.className = 'search-section-header';
    vh.textContent = 'Venues';
    resultsDiv.appendChild(vh);
    venueResults.slice(0,5).forEach(function(r) {
      var v = r.venue;
      var color = getMarkerColor(v.subcategory);
      var el = document.createElement('div');
      el.className = 'search-result';
      el.innerHTML =
        '<div class="sr-dot" style="background:' + color + '"></div>' +
        '<div class="sr-info">' +
          '<div class="sr-name">' + highlightMatch(v.name, query) + '</div>' +
          '<div class="sr-meta">' + (v.subcategory||'') + (v.address ? ' · ' + v.address : '') + '</div>' +
        '</div>' +
        '<span class="sr-badge" style="background:' + color + '">' + (v.subcategory||'').split(' ')[0] + '</span>';
      el.addEventListener('mousedown', function(e) {
        e.preventDefault(); // prevent blur before click
        selectResult(v, null);
      });
      resultsDiv.appendChild(el);
    });
  }

  // Event results
  if (eventResults.length > 0) {
    var eh = document.createElement('div');
    eh.className = 'search-section-header';
    eh.textContent = 'Events';
    resultsDiv.appendChild(eh);
    eventResults.slice(0,3).forEach(function(r) {
      var v = r.venue; var ev = r.event;
      var color = getMarkerColor(v.subcategory);
      var el = document.createElement('div');
      el.className = 'search-result';
      el.innerHTML =
        '<div class="sr-dot" style="background:' + color + '"></div>' +
        '<div class="sr-info">' +
          '<div class="sr-name">' + highlightMatch(ev.title, query) + '</div>' +
          '<div class="sr-meta">📍 ' + v.name + '</div>' +
          (ev.date ? '<div class="sr-event">📅 ' + ev.date + '</div>' : '') +
        '</div>';
      el.addEventListener('mousedown', function(e) {
        e.preventDefault();
        selectResult(v, ev);
      });
      resultsDiv.appendChild(el);
    });
  }

  resultsDiv.style.display = 'block';
}


function selectResult(venue, event) {
  // Fly to venue
  map.flyTo({ center: [venue.lng, venue.lat], zoom: 16, duration: 800 });
  // Open business card after fly
  setTimeout(function() { openBusinessCard(venue); }, 900);
  // Clear search
  clearSearch();
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('search-clear').style.display = 'none';
}

function showSearchBar() {
  var bar = document.getElementById('search-bar');
  bar.style.display = 'flex';
  
  var input = document.getElementById('search-input');
  if (input._searchReady) return; // already initialized
  input._searchReady = true;

  input.addEventListener('input', function() {
    doSearch(this.value.trim());
  });
  
  input.addEventListener('keydown', function(e) {
    var items = document.querySelectorAll('.search-result');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedResultIdx = Math.min(selectedResultIdx + 1, items.length - 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedResultIdx = Math.max(selectedResultIdx - 1, -1);
    } else if (e.key === 'Escape') {
      clearSearch(); return;
    } else if (e.key === 'Enter' && selectedResultIdx >= 0) {
      items[selectedResultIdx].click(); return;
    }
    items.forEach(function(el, i) {
      el.classList.toggle('selected', i === selectedResultIdx);
    });
  });

  document.addEventListener('click', function closeSearch(e) {
    if (!bar.contains(e.target)) {
      document.getElementById('search-results').style.display = 'none';
    }
  });
  
  setTimeout(function(){ input.focus(); }, 150);
}

// ─── Venue Popup ──────────────────────────────────────────────────────────────
function showVenuePopup(v) {
  document.getElementById('popup-name').textContent = v.name;
  document.getElementById('popup-category').textContent = v.subcategory || v.category || '';
  document.getElementById('popup-address').textContent = v.address;

  // Build events HTML - assembly line style: Today / Next / Upcoming
  var eventsHTML = '';
  var allVenueEvents = EVENTS[v.id] || [];

  // Parse dates and sort, filtering out past events
  var now = new Date();
  now.setHours(0,0,0,0); // compare by day

  function parseEventDate(dateStr) {
    if (!dateStr) return null;
    // Try to extract a date from strings like "September 25, 2026 · 7:10 PM"
    var clean = dateStr.split('·')[0].split('-')[0].trim();
    var d = new Date(clean);
    return isNaN(d.getTime()) ? null : d;
  }

  var todayEvents = [];
  var nextEvent = null;
  var upcomingEvents = [];

  var today = new Date(); today.setHours(0,0,0,0);
  var tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);

  allVenueEvents.forEach(function(ev) {
    var d = parseEventDate(ev.date);
    if (!d) { upcomingEvents.push(ev); return; }
    var evDay = new Date(d); evDay.setHours(0,0,0,0);
    if (evDay < today) return; // past — skip
    if (evDay.getTime() === today.getTime()) {
      todayEvents.push(ev);
    } else {
      upcomingEvents.push(ev);
    }
  });

  // Sort upcoming by date
  upcomingEvents.sort(function(a,b){
    var da = parseEventDate(a.date), db = parseEventDate(b.date);
    if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
    return da - db;
  });

  // First upcoming = "Next Event"
  if (upcomingEvents.length > 0 && todayEvents.length === 0) {
    nextEvent = upcomingEvents.shift();
  }

  function eventCard(ev, badge, badgeColor) {
    return '<div style="padding:10px 0;border-bottom:1px solid #f5f5f5;">' +
      (badge ? '<div style="display:inline-block;font-size:10px;font-weight:800;color:#fff;background:'+badgeColor+';padding:2px 8px;border-radius:10px;margin-bottom:6px;letter-spacing:0.5px;">' + badge + '</div>' : '') +
      '<div style="font-size:15px;font-weight:700;color:#111;">' + ev.title + '</div>' +
      (ev.subtitle ? '<div style="font-size:12px;color:#007AFF;font-weight:600;margin-top:2px;">' + ev.subtitle + '</div>' : '') +
      (ev.date ? '<div style="font-size:13px;color:#666;margin-top:3px;">📅 ' + ev.date + '</div>' : '') +
      (ev.url ? '<a href="' + getTicketLink(ev) + '" target="_blank" style="display:inline-block;font-size:12px;color:#007AFF;margin-top:5px;text-decoration:none;font-weight:600;">' + getAffiliateLabel(ev) + '</a>' : '') +
      '</div>';
  }

  if (todayEvents.length === 0 && !nextEvent && upcomingEvents.length === 0) {
    eventsHTML = '<div style="margin-top:12px;color:#999;font-size:13px;padding:10px 0;">No upcoming events scheduled</div>';
  } else {
    eventsHTML = '<div style="margin-top:14px;border-top:1px solid #eee;padding-top:12px;">';
    // TODAY
    todayEvents.forEach(function(ev) {
      eventsHTML += eventCard(ev, 'TODAY', '#FF3B30');
    });
    // NEXT
    if (nextEvent) {
      eventsHTML += eventCard(nextEvent, 'NEXT UP', '#FF9500');
    }
    // UPCOMING label
    if (upcomingEvents.length > 0) {
      eventsHTML += '<div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin:10px 0 4px;">Upcoming</div>';
      upcomingEvents.forEach(function(ev) {
        eventsHTML += eventCard(ev, null, null);
      });
    }
    eventsHTML += '</div>';
  }

  document.getElementById('popup-details').innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;margin-top:8px;">' +
    '<span style="font-size:14px;">' + (v.rating ? '⭐ ' + v.rating : '') + '</span>' +
    '<span style="font-size:12px;color:#666;">' + v.category + '</span>' +
    '</div>' + eventsHTML;

  var popup = document.getElementById('venue-popup');
  popup.style.display = 'block';
  setTimeout(function(){ popup.classList.add('open'); }, 10);
}

function closeVenuePopup() {
  var popup = document.getElementById('venue-popup');
  popup.classList.remove('open');
  setTimeout(function(){ popup.style.display = 'none'; }, 300);
}

// ─── Breadcrumb ───────────────────────────────────────────────────────────────
function updateBreadcrumb() {
  var bc = document.getElementById('breadcrumb');
  if (level === 'country') {
    bc.innerHTML = '<span class="crumb-current">United States</span>';
  } else if (level === 'state') {
    bc.innerHTML =
      '<span class="crumb" onclick="goToCountry()">United States</span>' +
      '<span class="crumb-sep">›</span>' +
      '<span class="crumb-current">' + selectedState + '</span>';
  } else if (level === 'city') {
    bc.innerHTML =
      '<span class="crumb" onclick="goToCountry()">United States</span>' +
      '<span class="crumb-sep">›</span>' +
      '<span class="crumb" onclick="goToState()">' + selectedState + '</span>' +
      '<span class="crumb-sep">›</span>' +
      '<span class="crumb-current">' + selectedCity + '</span>';
  }
}

function goToCountry() {
  removeFloridaVenueMarkers();
  if (level === 'country') return;
  level = 'country';
  selectedState = null; selectedCity = null;
  updateBreadcrumb();
  showHint('Click a state to explore');

  ['states-fill','states-border','florida-border','city-regions','city-region-borders','city-dots','city-labels','3d-buildings'].forEach(function(l) {
    if (map.getLayer(l)) map.removeLayer(l);
  });
  ['fl-voronoi','fl-cities'].forEach(function(s) {
    if (map.getSource(s)) map.removeSource(s);
  });
  venueMarkers.forEach(function(m){ m.remove(); });
  venueMarkers = [];
  document.getElementById('search-bar').style.display = 'none';
  hideFilterUI();
  closeVenuePopup();

  map.fitBounds(usaBounds(), { padding: { top: 70, bottom: 90, left: 10, right: 10 }, pitch: 0, bearing: 0, duration: 1500, essential: true });

  // Re-add state layers after fly completes
  setTimeout(function() {
    if (map.getSource('states')) {
      // Source still exists, just re-add the layers
      if (!map.getLayer('states-fill')) {
        map.addLayer({
          id: 'states-fill', type: 'fill', source: 'states',
          paint: {
            'fill-color': ['case', ['in', ['get', 'name'], ['literal', UNLOCKED_STATES]], '#007AFF', '#b8cce4'],
            'fill-opacity': ['case', ['boolean', ['feature-state', 'hover'], false], 0.5, ['in', ['get', 'name'], ['literal', UNLOCKED_STATES]], 0.35, 0.2]
          }
        });
      }
      if (!map.getLayer('states-border')) {
        map.addLayer({ id: 'states-border', type: 'line', source: 'states', paint: { 'line-color': '#4a7fb5', 'line-width': 1 } });
      }
      if (!map.getLayer('florida-border')) {
        map.addLayer({ id: 'florida-border', type: 'line', source: 'states', filter: ['in', ['get', 'name'], ['literal', UNLOCKED_STATES]], paint: { 'line-color': '#007AFF', 'line-width': 2.5 } });
      }
    }
  }, 1600);
}

function goToFlorida() {
  removeFloridaVenueMarkers();
  venueMarkersAdded = false;
  venueMarkers.forEach(function(m){ m.remove(); });
  venueMarkers = []; goToState(); }

function goToState() {
  if (level === 'state') return;
  level = 'state';
  selectedCity = null;
  updateBreadcrumb();
  showHint('Click a city to explore');

  venueMarkers.forEach(function(m){ m.remove(); });
  venueMarkers = [];
  ['city-regions','city-region-borders','city-dots','city-labels','3d-buildings'].forEach(function(l) {
    if (map.getLayer(l)) map.removeLayer(l);
  });
  ['fl-voronoi','fl-cities'].forEach(function(s) {
    if (map.getSource(s)) map.removeSource(s);
  });
  document.getElementById('search-bar').style.display = 'none';
  hideFilterUI();
  closeVenuePopup();

  var view = STATE_VIEWS[selectedState] || STATE_VIEWS['Florida'];
  map.flyTo({ center: view.center, zoom: view.zoom, pitch: 0, bearing: 0, duration: 1500, essential: true });

  // Re-add city regions after fly completes
  setTimeout(function() { view.addCities(); }, 1600);
}

// ── Business Card ─────────────────────────────────────────────────────────────
function openBusinessCard(venue) {
  var color = getMarkerColor(venue.subcategory);
  
  document.getElementById('bc-header').style.background = 
    'linear-gradient(135deg, ' + color + ' 0%, ' + color + 'aa 100%)';
  document.getElementById('bc-category-badge').textContent = venue.subcategory || '';
  document.getElementById('bc-name').textContent = venue.name;
  document.getElementById('bc-subtitle').textContent = 
    venue.capacity ? 'Capacity: ' + venue.capacity.toLocaleString() + ' guests' : '';

  var directionsUrl = 'https://www.google.com/maps/search/?api=1&query=' + 
    encodeURIComponent(venue.name + ' ' + (venue.address || ''));
  document.getElementById('bc-directions').href = directionsUrl;

  var events = EVENTS[venue.id] || [];
  var ticketUrl = events.length > 0 && events[0].url ? events[0].url : null;
  var ticketsBtn = document.getElementById('bc-tickets');
  if (ticketUrl) { ticketsBtn.href = ticketUrl; ticketsBtn.style.display = 'flex'; }
  else { ticketsBtn.style.display = 'none'; }

  var body = document.getElementById('bc-body');
  body.innerHTML = '';

  // Info section
  var infoHTML = '<div class="bc-section"><div class="bc-section-title">Venue Info</div>';
  if (venue.address) infoHTML += '<div class="bc-info-row"><span class="bc-icon">📍</span><span class="bc-info-text">' + venue.address + '</span></div>';
  if (venue.capacity) {
    var pct = Math.min(100, Math.round((venue.capacity / 70000) * 100));
    infoHTML += '<div class="bc-info-row"><span class="bc-icon">👥</span><div style="flex:1"><span class="bc-info-text">Capacity: ' + venue.capacity.toLocaleString() + '</span><div class="bc-capacity-bar"><div class="bc-capacity-fill" style="width:' + pct + '%"></div></div></div></div>';
  }
  if (venue.subcategory) infoHTML += '<div class="bc-info-row"><span class="bc-icon">🏛</span><span class="bc-info-text">' + venue.subcategory + '</span></div>';
  if (venue.rating) infoHTML += '<div class="bc-info-row"><span class="bc-icon">⭐</span><span class="bc-info-text">' + venue.rating + ' / 5.0</span></div>';
  infoHTML += '</div>';
  body.innerHTML += infoHTML;

  // Events section
  var today = new Date(); today.setHours(0,0,0,0);
  function parseEvDate(ds) {
    if (!ds) return null;
    var c = ds.split('·')[0].split('–')[0].trim();
    var d = new Date(c); return isNaN(d.getTime()) ? null : d;
  }

  var evHTML = '<div class="bc-section"><div class="bc-section-title">Event Posters</div>';
  if (events.length > 0) {
    var shown = 0;
    events.forEach(function(ev) {
      if (shown >= 6) return;
      var d = parseEvDate(ev.date);
      var dDay = d ? new Date(d.setHours(0,0,0,0)) : null;
      var isToday = dDay && dDay.getTime() === today.getTime();
      var badge = isToday 
        ? '<span class="bc-event-badge" style="background:#FF3B30">TODAY</span>'
        : shown === 0 
          ? '<span class="bc-event-badge" style="background:#FF9500">NEXT UP</span>'
          : '';
      var poster = ((isToday || shown === 0) && ev.image)
        ? '<a class="bc-poster" href="' + (ev.url||'#') + '" target="_blank"><img src="' + ev.image + '" alt="" loading="lazy"><span class="bc-poster-tag" style="background:' + (isToday ? '#FF3B30' : '#FF9500') + '">' + (isToday ? '🔴 HAPPENING TODAY' : '⏭ NEXT UP') + '</span></a>'
        : '';
      evHTML += '<div class="bc-event' + (isToday ? ' bc-event-today' : '') + '">' + poster + badge +
        '<div class="bc-event-title">' + ev.title + '</div>' +
        (ev.date ? '<div class="bc-event-date">📅 ' + ev.date + '</div>' : '') +
        (ev.url ? '<a class="bc-event-ticket" href="' + ev.url + '" target="_blank">🎟 Get Tickets →</a>' : '') +
        '</div>';
      shown++;
    });
  } else {
    evHTML += '<div style="color:#999;font-size:13px;padding:8px 0;">No upcoming events scheduled · <a href="https://www.ticketmaster.com/search?q=' + encodeURIComponent(venue.name) + '" target="_blank" style="color:#007AFF;font-weight:600;">Check Ticketmaster →</a></div>';
  }
  evHTML += '</div>';
  body.innerHTML += evHTML;

  var _sb=document.getElementById('search-bar'); if(_sb) _sb.style.display='none';
  document.getElementById('business-card').classList.add('open');
}

function closeBusinessCard() {
  document.getElementById('business-card').classList.remove('open');
}
